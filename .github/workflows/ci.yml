name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loomlink
          POSTGRES_PASSWORD: loomlink
          POSTGRES_DB: loomlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Mypy
        run: mypy app/ --ignore-missing-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://loomlink:loomlink@localhost:5432/loomlink_test
          JWT_SECRET: ci-test-secret-32-chars-minimum
          APP_ENV: development
          DEMO_MODE: "true"
          MILL_TIMEZONE: Asia/Kolkata
        run: alembic upgrade head

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://loomlink:loomlink@localhost:5432/loomlink_test
          JWT_SECRET: ci-test-secret-32-chars-minimum
          APP_ENV: development
          DEMO_MODE: "true"
          MILL_TIMEZONE: Asia/Kolkata
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm test

  contract-check:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loomlink
          POSTGRES_PASSWORD: loomlink
          POSTGRES_DB: loomlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Export OpenAPI
        env:
          DATABASE_URL: postgresql+psycopg://loomlink:loomlink@localhost:5432/loomlink_test
          JWT_SECRET: ci-test-secret-32-chars-minimum
          APP_ENV: development
          DEMO_MODE: "true"
          MILL_TIMEZONE: Asia/Kolkata
        run: python backend/scripts/export_openapi.py

      - name: Check openapi.json not changed
        run: |
          git diff --exit-code docs/openapi.json && echo "OpenAPI is up to date" || \
          (echo "ERROR: docs/openapi.json has changed. Run 'make gen-api' and commit the result." && exit 1)