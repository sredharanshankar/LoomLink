version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loomlink
      POSTGRES_PASSWORD: loomlink
      POSTGRES_DB: loomlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Single worker: in-process event bus and WebSocket hub require one process.
    # See docs/DECISIONS.md.
    command: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:8000
      --timeout 120
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://loomlink:loomlink@db:5432/loomlink
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config: